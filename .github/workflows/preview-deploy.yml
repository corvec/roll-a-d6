name: Preview Deploy

# Builds Engineer's Dice Roller against this branch's version of roll-a-d6 and
# publishes it to a temp URL: https://demo.dicerollr.com/<short-sha>/
#
# demo.dicerollr.com is the GitHub Pages site of corvec/roll-a-d6-basic; each
# preview lives in a subdirectory of its gh-pages branch, alongside the
# production deploy at the root. Requires the PREVIEW_DEPLOY_TOKEN secret
# (a token with contents read/write on corvec/roll-a-d6-basic).
#
# Trigger by adding the `deploy-preview` label to a PR (subsequent pushes then
# redeploy automatically), or manually via workflow_dispatch.

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    runs-on: ubuntu-latest
    steps:
      - name: Check out roll-a-d6
        uses: actions/checkout@v4
        with:
          path: roll-a-d6

      - name: Use Node 22 for the library build
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build and pack roll-a-d6
        id: pack
        working-directory: roll-a-d6
        run: |
          npm ci
          npm run build
          echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check out engineers-dice-roller
        uses: actions/checkout@v4
        with:
          repository: corvec/engineers-dice-roller
          # Compat branch for the post-TypeScript roll-a-d6 API; switch to the
          # default branch once the compat changes are merged there.
          ref: claude/roll-a-d6-0.4-compat
          path: app

      - name: Use Node 16 for the CRA build
        # react-scripts 3.x (webpack 4) fails on Node 17+ due to the OpenSSL 3
        # digest change; drop this step once the app's toolchain is modernized.
        uses: actions/setup-node@v4
        with:
          node-version: 16.x

      - name: Build the app against the packed library
        working-directory: app
        env:
          PUBLIC_URL: /${{ steps.pack.outputs.sha }}
          # CRA treats lint warnings as build failures when CI=true
          CI: 'false'
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/roll-a-d6/${{ steps.pack.outputs.tarball }}"
          npm run build

      - name: Check out demo site (gh-pages of roll-a-d6-basic)
        uses: actions/checkout@v4
        with:
          repository: corvec/roll-a-d6-basic
          ref: gh-pages
          path: site
          token: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}

      - name: Publish preview
        shell: bash
        run: |
          sha="${{ steps.pack.outputs.sha }}"
          rm -rf "site/$sha"
          mkdir -p "site/$sha"
          cp -r app/build/. "site/$sha/"
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$sha"
          if git diff --cached --quiet; then
            echo "Preview unchanged; nothing to push"
          else
            git commit -m "Preview deploy $sha from roll-a-d6 ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
            git push
          fi
          echo "### Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://demo.dicerollr.com/$sha/" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "🎲 Preview of Engineer's Dice Roller built with this branch: https://demo.dicerollr.com/${{ steps.pack.outputs.sha }}/"
